name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vance-${{ matrix.os }}

      - name: Format check
        run: cargo xtask fmt-check

      - name: Clippy
        run: cargo xtask clippy

      - name: Test
        run: cargo xtask test

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ui
        run: pnpm lint

      - name: Build
        working-directory: ui
        run: pnpm build

  # Phase 0 stub for the Tauri build matrix; expanded in Phase 11.
  tauri-smoke:
    name: Tauri smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust, ui]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-${{ matrix.os }}

      - name: Install UI deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: pnpm build

      - name: Cargo build vance-app
        run: cargo build -p vance-app
