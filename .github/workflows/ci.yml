name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Intentional: Windows is non-blocking until the Windows/Linux milestone
    # sets up FFmpeg dev libraries there (and replaces the stub viewport).
    # It still runs, so its results stay visible on every push.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Intentional: ubuntu-24.04, not -latest. ubuntu-latest (26.04) ships
        # FFmpeg 8, but ffmpeg-the-third 3.x supports <= 7.1. Unpin when the
        # bindings move to ffmpeg-the-third 6.x (media/export milestone).
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libavfilter-dev libavdevice-dev \
            libasound2-dev ffmpeg

      # ffmpeg-sys-the-third supports FFmpeg <= 7.1; brew's default `ffmpeg` is
      # 8.x, so use the keg-only ffmpeg@7 and point FFMPEG_DIR at it (its build
      # script would otherwise find 8.x first — see CONTRIBUTING). Its bin dir
      # goes on PATH so the real-media e2e tests run instead of skipping.
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config ffmpeg@7
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg@7)" >> "$GITHUB_ENV"
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vance-${{ matrix.os }}

      - name: Format check
        run: cargo xtask fmt-check

      # tauri::generate_context!() embeds `frontendDist` (ui/build) at compile
      # time and fails if it's missing. This job checks Rust only, so a stub
      # page is enough; the tauri-smoke job builds and embeds the real UI.
      - name: Stub the UI bundle
        shell: bash
        run: |
          mkdir -p ui/build
          [ -f ui/build/index.html ] || echo '<!doctype html><title>Vance</title>' > ui/build/index.html

      - name: Clippy
        run: cargo xtask clippy

      - name: Test
        run: cargo xtask test

  # The default workspace build never enables `--features lv2`, so livi /
  # lilv (and the whole point of the vendored macOS lv2-sys patch) would go
  # untested. This lane installs the LV2 system deps and exercises the
  # feature on Linux + macOS (the macOS leg covers the patched bindings).
  lv2:
    name: LV2 hosting (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install LV2 deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config liblilv-dev libserd-dev libasound2-dev

      - name: Install LV2 deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config lilv

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lv2-${{ matrix.os }}

      - name: Assert lv2-sys resolves to the vendored patch
        run: |
          cargo tree -p vance-plugin-host --features lv2 -i lv2-sys | tee /tmp/lv2-tree
          grep -q 'vendor/lv2-sys' /tmp/lv2-tree \
            || { echo '::error::lv2-sys did not resolve to vendor/lv2-sys — the macOS patch is bypassed'; exit 1; }

      - name: Clippy (lv2 sidecar backend)
        # Scoped to vance-plugin-host: its dep graph carries no pre-existing
        # deny-level lint debt, so this lints the new lv2_backend cleanly.
        # vance-audio's lv2 module is compiled (and run) by the test step.
        run: cargo clippy -p vance-plugin-host --features lv2 --all-targets

      - name: Test (lv2)
        run: |
          # plugin-host first: builds the lv2 sidecar binary + fixture, so the
          # vance-audio mixer test finds an lv2-capable sidecar (else it skips).
          cargo test -p vance-plugin-host --features lv2
          cargo test -p vance-audio --features lv2

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ui
        run: pnpm lint

      - name: Build
        working-directory: ui
        run: pnpm build

  # Phase 0 stub for the Tauri build matrix; expanded in Phase 11.
  tauri-smoke:
    name: Tauri smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust, ui]
    # Intentional: non-blocking on Windows for the same reason as `rust`.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Intentional: ubuntu-24.04, not -latest. ubuntu-latest (26.04) ships
        # FFmpeg 8, but ffmpeg-the-third 3.x supports <= 7.1. Unpin when the
        # bindings move to ffmpeg-the-third 6.x (media/export milestone).
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libavfilter-dev libavdevice-dev \
            libasound2-dev ffmpeg

      # ffmpeg-sys-the-third supports FFmpeg <= 7.1; brew's default `ffmpeg` is
      # 8.x, so use the keg-only ffmpeg@7 and point FFMPEG_DIR at it (its build
      # script would otherwise find 8.x first — see CONTRIBUTING). Its bin dir
      # goes on PATH so the real-media e2e tests run instead of skipping.
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config ffmpeg@7
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg@7)" >> "$GITHUB_ENV"
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-${{ matrix.os }}

      - name: Install UI deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: pnpm build

      - name: Cargo build vance-app
        run: cargo build -p vance-app
