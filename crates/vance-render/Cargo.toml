[package]
name = "vance-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
vance-core = { workspace = true }
vance-color = { workspace = true }
vance-decoder = { workspace = true }
vance-timeline = { workspace = true }
vance-mograph = { workspace = true }
vance-fusion = { workspace = true }
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
thiserror = { workspace = true }
tracing = { workspace = true }
# Pure-Rust glyph rasterizer used by the title renderer. Loads a
# system font lazily (see `title::system_font_candidates`).
fontdue = "0.9"

[dev-dependencies]
# The HDR golden test names the 10-bit target format + builds a Rec.2020-PQ
# pipeline, so it needs wgpu (the format enum) and vance-color (the pipeline).
wgpu = "29"
vance-color = { workspace = true }
