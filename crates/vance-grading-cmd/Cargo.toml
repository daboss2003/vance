# Typed grading commands — the AI-facing API surface (Phase 6.13). Pure
# data + schema generation; no engine deps. Consumers (vance-app +
# vance-ai-runtime + vance-cli) translate `GradingCommand` into engine
# method calls. Defining it here (not in vance-app) lets vance-ai-runtime
# load the schema without pulling in Tauri / wgpu.

