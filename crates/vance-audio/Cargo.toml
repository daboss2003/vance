[package]
name = "vance-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "vance-audio-decoder"
path = "src/bin/main.rs"

[dependencies]
vance-core = { workspace = true }
vance-ipc = { workspace = true }
# Parent-side plugin client (PluginClient) + shared wire types: the
# fold thread talks to the sandboxed `vance-plugin-host` sidecar for
# out-of-process CLAP processing.
vance-audio-plugins = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# cpal for output, ringbuf for the lock-free producer/consumer ring that
# moves PCM samples from the IPC-puller thread into the cpal callback.
cpal = "0.16"
ringbuf = "0.4"

# Symphonia is the pure-Rust audio decode crate. Default features cover
# AAC, FLAC, MP3, OGG, PCM, WAV — everything common in our target media.
symphonia = { version = "0.5", features = ["aac", "flac", "mp3", "wav", "isomp4", "pcm"] }

# Phase 7.3 mixer: ArcSwap publishes MixerSnapshot from the engine
# (edit-log thread) to the fold thread without locks; uuid is used as
# track / clip identifiers to keep vance-audio decoupled from the
# vance-timeline crate.
arc-swap = "1"
uuid = { workspace = true }

# Phase 7.10/7.11 — real third-party audio plugin backends, feature-
# gated so the default build needs no system libs / extra crates.
# `clap` is pure-Rust (clack-host) + dlopen; `lv2` links system liblilv.
clack-host = { version = "0.1", optional = true }
clack-extensions = { version = "0.1", optional = true, features = [
    "audio-ports",
] }
livi = { version = "0.7", optional = true }

[features]
default = []
clap = ["dep:clack-host", "dep:clack-extensions"]
lv2 = ["dep:livi"]

# The out-of-process plugin watchdog kills a hung sidecar by PID (the
# fold thread is blocked in IPC and can't kill its own client). std has
# no portable kill-by-pid, so reach for the platform primitive.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
bincode = { version = "2", features = ["serde"] }
# Integration tests don't inherit the lib's deps, so re-declare the few
# the remote-plugin test drives directly.
uuid = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
