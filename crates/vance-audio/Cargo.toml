[package]
name = "vance-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "vance-audio-decoder"
path = "src/bin/main.rs"

[dependencies]
vance-core = { workspace = true }
vance-ipc = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# cpal for output, ringbuf for the lock-free producer/consumer ring that
# moves PCM samples from the IPC-puller thread into the cpal callback.
cpal = "0.16"
ringbuf = "0.4"

# Symphonia is the pure-Rust audio decode crate. Default features cover
# AAC, FLAC, MP3, OGG, PCM, WAV — everything common in our target media.
symphonia = { version = "0.5", features = ["aac", "flac", "mp3", "wav", "isomp4", "pcm"] }

# Phase 7.3 mixer: ArcSwap publishes MixerSnapshot from the engine
# (edit-log thread) to the fold thread without locks; uuid is used as
# track / clip identifiers to keep vance-audio decoupled from the
# vance-timeline crate.
arc-swap = "1"
uuid = { workspace = true }

[dev-dependencies]
bincode = { version = "2", features = ["serde"] }
