[package]
name = "vance-plugin-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Default: just the shared ABI + manifest types. Lean enough that a
# wasm32 guest plugin can depend on this crate without pulling host
# machinery.
default = []
# `host` pulls in the wasmtime runtime + frame-processing host. Enabled
# by vance-app / vance-effects.
host = ["dep:wasmtime", "dep:anyhow", "dep:serde_json"]
# `guest` provides the export-glue helpers a plugin author uses.
guest = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, optional = true } # `.vef` container header (host-only)
ron = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Host-only deps (feature-gated so guest builds stay tiny).
wasmtime = { version = "27", optional = true, default-features = false, features = [
    "cranelift",
    "runtime",
] }
anyhow = { workspace = true, optional = true }

[dev-dependencies]
ron = { workspace = true }
wat = "1"
