[package]
name = "vance-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Build a binary that the parent process spawns as the plugin sandbox.
[[bin]]
name = "vance-plugin-host"
path = "src/main.rs"

[dependencies]
vance-audio-plugins = { workspace = true }
vance-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# CLAP discovery enumerates real `.clap` bundles via clack-host
# (pure-Rust + dlopen). Feature-gated so the default build pulls in
# nothing extra and runs without any plugins installed.
clack-host = { version = "0.1", optional = true }
# `params` extension (host side): enumerate a plugin's parameters + push
# param-value events so the FX panel's knobs actually affect the audio.
clack-extensions = { version = "0.1", optional = true, features = [
    "params",
    "clack-host",
] }

# The actual plugin runtimes are feature-gated so the binary builds
# cleanly even when the system libraries (liblilv for LV2) aren't
# installed. Users who want plugin support pass --features lv2,clap.
[features]
default = []
lv2 = []
clap = ["dep:clack-host", "dep:clack-extensions"]
