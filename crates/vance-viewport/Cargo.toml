[package]
name = "vance-viewport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
vance-core = { workspace = true }
vance-render = { workspace = true }
wgpu = "29"
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer"] }
