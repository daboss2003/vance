[package]
name = "vance-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "vance_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vance-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Pass-through to light up the native OpenColorIO path (Phase 6.1b).
# Build/run with `--features ocio`; needs `brew install opencolorio`.
# Without it, OCIO commands return a clear "not enabled" error.
ocio = ["vance-ocio/ocio"]

# Third-party audio-plugin support. Each forwards to BOTH the in-process
# processing path (`vance-audio`, run on the real-time fold thread) AND
# the sandboxed discovery sidecar (`vance-plugin-host`), so a single
# opt-in lights up the whole chain — discovery + hosting. Build the app
# and the sidecar together so feature unification reaches the sidecar
# binary, e.g.:
#   cargo build -p vance-app -p vance-plugin-host --features vance-app/clap
# `clap` is pure-Rust (clack-host + dlopen); `lv2` links system liblilv
# (`brew install lilv`).
clap = ["vance-audio/clap", "vance-plugin-host/clap"]
lv2 = ["vance-audio/lv2", "vance-plugin-host/lv2"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "29"
pollster = "0.4"
vance-core = { workspace = true }
vance-color = { workspace = true }
vance-ocio = { workspace = true }
vance-scopes = { workspace = true }
vance-tracker = { workspace = true }
vance-grading-cmd = { workspace = true }
vance-time = { workspace = true }
vance-decoder = { workspace = true }
vance-encoder = { workspace = true }
vance-cache = { workspace = true }
vance-plugin-sdk = { workspace = true, features = ["host"] }
vance-ofx = { workspace = true }
tracing-chrome = { workspace = true }
vance-render = { workspace = true }
vance-effects = { workspace = true } # M6 — GPU shader effects
vance-mograph = { workspace = true }
vance-fusion = { workspace = true }
vance-captions = { workspace = true }
vance-control = { workspace = true }
vance-publish = { workspace = true }
vance-viewport = { workspace = true }
# GOAT-10 — MIDI control-surface input (CoreMIDI / ALSA / WinMM).
midir = "0.10"
# GOAT-11 — HTTPS for OAuth token exchange + platform uploads. Also used by
# the managed AI-tool downloader (tools.rs).
reqwest = { version = "0.13", features = ["blocking", "json"] }
# Checksum verification for downloaded AI-tool artifacts (tools.rs).
sha2 = "0.10"
vance-audio = { workspace = true }
vance-audio-plugins = { workspace = true }
# Linked only so the app's `clap`/`lv2` features can forward to the
# sidecar's, building it with matching support in one invocation. The
# sidecar itself runs as a spawned process, not an in-proc library.
vance-plugin-host = { workspace = true }
vance-timeline = { workspace = true }
vance-project = { workspace = true }
vance-peaks = { workspace = true }
# Every child process the app starts goes through `vance_ipc::process`.
vance-ipc = { workspace = true }
uuid = { workspace = true }
arc-swap = "1"
# M1 — accounts client: OS keychain for tokens (spec §4.3), with an
# app-managed AES-256-GCM file fallback when no keychain is present (Linux
# headless / minimal — closes the flagged gap), and OS randomness for PKCE.
keyring = "3"
aes-gcm = "0.10"
rand = "0.8"
tokio = { workspace = true } # spawn_blocking for accounts network calls
# M2 — verify the backend's Ed25519 entitlement token OFFLINE (spec §6).
ed25519-dalek = "2"
base64 = "0.22"
# M4 — unseal the per-device content key + decrypt paid effects at load (spec §7).
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The memory budget's RAM query (GlobalMemoryStatusEx); same windows-sys
# version vance-ipc and vance-audio already use.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = { workspace = true }
