[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/vance-core",
    "crates/vance-time",
    "crates/vance-color",
    "crates/vance-ocio",
    "crates/vance-scopes",
    "crates/vance-tracker",
    "crates/vance-grading-cmd",
    "crates/vance-peaks",
    "crates/vance-media",
    "crates/vance-ffmpeg-sys",
    "crates/vance-decoder",
    "crates/vance-encoder",
    "crates/vance-audio",
    "crates/vance-audio-plugins",
    "crates/vance-render",
    "crates/vance-effects",
    "crates/vance-timeline",
    "crates/vance-expr",
    "crates/vance-mograph",
    "crates/vance-fusion",
    "crates/vance-captions",
    "crates/vance-control",
    "crates/vance-publish",
    "crates/vance-engine",
    "crates/vance-project",
    "crates/vance-otio",
    "crates/vance-cache",
    "crates/vance-plugin-host",
    "crates/vance-plugin-sdk",
    "crates/vance-ofx",
    "crates/vance-ofx-testplugin",
    "crates/vance-clap-testplugin",
    "crates/vance-lv2-testplugin",
    "crates/vance-ai",
    "crates/vance-ai-runtime",
    "crates/vance-ipc",
    "crates/vance-viewport",
    "crates/vance-app",
    "crates/vance-cli",
    "crates/vance-bench",
    "crates/vance-buildsvc",
]
# Phase 10 — sample WASM plugins. Excluded from the host workspace
# build because they only target wasm32-unknown-unknown (cdylib). Build
# them with `xtask build-plugins` or directly:
#   cargo build --release --target wasm32-unknown-unknown \
#       --manifest-path plugins/stylize/Cargo.toml
exclude = [
    "plugins/stylize",
    "plugins/dissolve",
    "plugins/zoom",
    "plugins/spin",
    "plugins/glitch",
    "plugins/rgbsplit",
    "plugins/whippan",
    "vendor/lv2-sys",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/your-org/vance"
authors = ["Vance contributors"]

[workspace.dependencies]
# Internal crates (other workspace members reference these by name)
vance-core = { path = "crates/vance-core" }
vance-time = { path = "crates/vance-time" }
vance-color = { path = "crates/vance-color" }
vance-ocio = { path = "crates/vance-ocio" }
vance-scopes = { path = "crates/vance-scopes" }
vance-tracker = { path = "crates/vance-tracker" }
vance-grading-cmd = { path = "crates/vance-grading-cmd" }
vance-peaks = { path = "crates/vance-peaks" }
vance-media = { path = "crates/vance-media" }
vance-ffmpeg-sys = { path = "crates/vance-ffmpeg-sys" }
vance-decoder = { path = "crates/vance-decoder" }
vance-encoder = { path = "crates/vance-encoder" }
vance-audio = { path = "crates/vance-audio" }
vance-audio-plugins = { path = "crates/vance-audio-plugins" }
vance-render = { path = "crates/vance-render" }
vance-effects = { path = "crates/vance-effects" }
vance-timeline = { path = "crates/vance-timeline" }
vance-expr = { path = "crates/vance-expr" }
vance-mograph = { path = "crates/vance-mograph" }
vance-fusion = { path = "crates/vance-fusion" }
vance-captions = { path = "crates/vance-captions" }
vance-control = { path = "crates/vance-control" }
vance-publish = { path = "crates/vance-publish" }
vance-engine = { path = "crates/vance-engine" }
vance-project = { path = "crates/vance-project" }
vance-otio = { path = "crates/vance-otio" }
vance-cache = { path = "crates/vance-cache" }
vance-plugin-host = { path = "crates/vance-plugin-host" }
vance-plugin-sdk = { path = "crates/vance-plugin-sdk" }
vance-ofx = { path = "crates/vance-ofx" }
vance-ai = { path = "crates/vance-ai" }
vance-ai-runtime = { path = "crates/vance-ai-runtime" }
vance-ipc = { path = "crates/vance-ipc" }
vance-viewport = { path = "crates/vance-viewport" }
vance-lv2-testplugin = { path = "crates/vance-lv2-testplugin" }

# External
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-chrome = "0.7"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
ron = "0.8"
libloading = "0.8"
tempfile = "3"
proptest = "1"
libc = "0.2"
# Sandboxed scripting for the parameter expression engine (pure Rust).
rhai = "1"

# rust-lv2's `lv2-sys` gates macOS out with a compile_error, even though
# its LV2 C-ABI bindings are platform-identical (the one exception, the
# AArch64 `va_list` layout, is unused — see vendor/lv2-sys/src/lib.rs).
# The vendored copy lifts that gate (macOS → Linux bindings) so LV2
# hosting (the `lv2` feature) can build on macOS. Consulted whenever
# `lv2-sys` is in the graph: always, since `vance-lv2-testplugin` depends
# on it directly, and additionally via `livi` when `lv2` is enabled.
#
# The patch is `lv2-sys` 2.0.0; it only substitutes for requirements it
# satisfies (`^2`). `livi` is pinned to `=0.7.5` (which requires `lv2-sys
# = "2"`) so a future major bump can't silently fall back to the
# macOS-broken registry crate; CI also asserts lv2-sys resolves here.
[patch.crates-io]
lv2-sys = { path = "vendor/lv2-sys" }

[profile.dev]
incremental = true
# Intentional: line tables only (not full debug info) — panics and
# backtraces keep file:line, but the target dir no longer balloons to
# 100+ GB. Full debug info for a local debugger session:
#   CARGO_PROFILE_DEV_DEBUG=true cargo build -p <crate>
debug = "line-tables-only"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

# Apply release-level optimization to dependencies even in dev builds.
# Speeds up wgpu/ffmpeg/etc. without making our own iteration loop slow.
[profile.dev.package."*"]
opt-level = 2
# Intentional: no debug info for third-party crates (wgpu, wasmtime, tauri,
# naga, sqlx …) — it was the bulk of the target dir and nobody steps into them.
debug = false

# Intentional: the per-frame hot path is optimised even in dev builds. Frame
# IPC (vance-ipc) and the decoder sidecar move every decoded frame; unoptimised
# they made debug playback of 4K 10-bit ProRes ~15x slower (0.8 vs ~11 fps on
# an M1). Both crates are small, so the extra compile time is negligible.
[profile.dev.package.vance-ipc]
opt-level = 2
[profile.dev.package.vance-decoder]
opt-level = 2
# Compositing (ADR 0007): the per-layer render passes, frame cache and colour
# maths run on every frame of every layer. Unoptimised, 4-layer 1080p playback
# dropped 12–37 of 240 frames and export ran at 19 fps on an M1.
[profile.dev.package.vance-render]
opt-level = 2
[profile.dev.package.vance-cache]
opt-level = 2
[profile.dev.package.vance-color]
opt-level = 2
